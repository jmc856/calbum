[project]
name = "calbum"
version = "0.0.0"
description = "Album catalog pipeline: Spotify write surface -> canonical JSON -> generated read surfaces."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calbum"]
