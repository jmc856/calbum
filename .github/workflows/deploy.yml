name: deploy

# Push-triggered, so frontend code goes live immediately instead of waiting
# for the next scheduled sync tick.
#
# The load-bearing detail: sync.yml's three commit steps ALL carry "[skip ci]"
# (sync.yml:93,117,177), and GitHub honors that marker for every workflow a
# push triggers — including this one. That is the only reason sync's own data
# commits don't double-trigger a build here and race sync's deploy job into
# the same Pages environment. Drop "[skip ci]" from any of those three and
# this workflow starts firing on them.
#
# NOTE: this job duplicates sync.yml's deploy job almost exactly — see the
# "Deployment" note in PLAN.md for why it wasn't extracted.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"

# Own concurrency group, distinct from sync's "sync" group, so a code push
# doesn't queue behind (or block) the data pipeline. cancel-in-progress: true
# here (unlike sync.yml) because a superseded build has nothing worth
# finishing — the newer push is what should end up live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v5
