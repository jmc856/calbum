name: sync

# schedule + workflow_dispatch only — never a PR-shaped trigger. Good hygiene
# for any repo holding GOOGLE_SA_JSON in secrets, private or not (see PLAN.md
# "Key decisions"). Every 4 hours, not hourly, to keep headroom against the
# private repo's 2,000 Actions-minutes/month budget. workflow_dispatch lets
# you trigger a run on demand instead of waiting for the next scheduled tick,
# with a dropdown to pick which step(s) to run — a scheduled run always runs
# everything regardless of this input (it's only read for workflow_dispatch).
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "What to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - poll
          - overrides
          - enrich
          - sheets
          - site
          - artists

# Single-writer discipline (constraint 5): only this workflow ever writes to
# the repo. Each commit step commits locally FIRST, then `git pull --rebase`,
# then push — `git rebase` refuses to run at all with anything staged in the
# index, regardless of whether a rebase is actually needed, so pulling before
# committing fails the moment there's a real change to commit (confirmed
# live: https://github.com/jmc856/calbum/actions/runs/31882137319). The
# concurrency group handles the case of a manual dispatch overlapping the
# cron — without it, that overlap is exactly the scenario constraint 5 rules
# out. cancel-in-progress stays false: a poll run in flight should finish and
# write, not be killed mid-write (the writer is atomic, but a cancelled run
# still leaves the cache/commit state half-applied).
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # Explicit version, not floating — a drifted interpreter is how a
      # working local build becomes a red cron job nobody notices for weeks.
      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run poller
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'poll'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GITHUB_ACTIONS: "true"
        run: uv run python -m calbum.poll

      # Runs right after poll, before enrichment: a manual album needs to
      # exist before enrich can fill in its genres, and a corrected title
      # needs to be in place before enrich sends it to Discogs' search (see
      # overrides.py's module docstring). Reads data/overrides.toml — no
      # secrets needed. Shares poll's commit step below (both touch
      # data/albums.json) rather than getting a separate commit.
      - name: Apply overrides
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'poll' || github.event.inputs.target == 'overrides'
        run: uv run python -m calbum.overrides

      - name: Commit and push poll/overrides results if changed
        run: |
          git config user.name "calbum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "sync: poll _selected + apply overrides [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Separate step, separate commit — deliberately after the poll commit
      # above has already landed. If Discogs is down or something outside
      # enrich.py's own per-album degrade (decision 2) blows up, newly
      # polled albums must still be committed; they must not wait on
      # enrichment succeeding.
      - name: Run enrichment
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'enrich'
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: uv run python -m calbum.enrich

      - name: Commit and push enrichment results if changed
        run: |
          git config user.name "calbum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "sync: enrich genres [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # No commit step needed — calbum.sheets writes directly to Google
      # Sheets (an external API), not to files in this repo.
      #
      # continue-on-error: the Sheets read surface and the site/deploy read
      # surface are unrelated downstream consumers of the same albums.json —
      # a Google-side hiccup here has no bearing on whether the frontend
      # should ship. Without this, a step failure here halts the rest of the
      # job by default (site export, its commit, and the deploy job chained
      # off `needs: sync` all get skipped), which is exactly what happened
      # on a transient `gspread.exceptions.APIError: [503]` on 2026-08-20 —
      # confirmed via the run's per-step log, poll/enrich had already
      # committed cleanly and only sheets failed. The step still shows
      # failed in the Actions UI for visibility; it just no longer cascades.
      - name: Run sheets writer
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'sheets'
        continue-on-error: true
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: uv run python -m calbum.sheets

      # Emits web/src/data/albums.json, which the frontend imports at build
      # time. Committing it is what triggers the deploy job (chained off
      # `needs: sync` below, not a push trigger — see that job's comment).
      - name: Run site export
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'site'
        run: uv run python -m calbum.site

      # Emits web/src/data/artists.json (portraits for the Artists tab). The
      # artist blobs are cached write-once, so a steady-state run makes zero
      # requests here and only new artists cost anything.
      #
      # continue-on-error for the same reason the sheets writer has it: this
      # is the last consumer in the chain, and a Spotify hiccup fetching
      # portraits must not take the albums payload — already written by the
      # step above — down with it. The commit step below is shared, so a
      # failure here still ships the album data.
      - name: Run artists export
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'site' || github.event.inputs.target == 'artists'
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GITHUB_ACTIONS: "true"
        run: uv run python -m calbum.artists

      - name: Commit and push site payload if changed
        run: |
          git config user.name "calbum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/data/ data/raw/spotify/artists/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "sync: site payload [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Deploy runs as a job here rather than on a push trigger, deliberately.
  # Every commit this workflow makes carries "[skip ci]" (needed so a data
  # commit doesn't retrigger the whole sync), and GitHub Actions HONORS that
  # marker — a push-triggered Pages workflow would therefore never fire, and
  # the site would silently freeze while the data kept updating. Netlify
  # ignored "[skip ci]", which is why this wasn't a problem before.
  # Chaining off `needs: sync` sidesteps the marker entirely.
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the branch tip, NOT the triggering SHA — the sync job
      # above just pushed the fresh payload, and the default checkout would
      # build the pre-sync commit and deploy stale data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
