# Netlify build config. The repo is private; connect it once in Netlify's UI
# (an OAuth flow) and this file drives everything after.
#
# Data commits from the sync workflow carry "[skip ci]", which suppresses
# GitHub Actions but NOT Netlify (which looks for "[skip netlify]") — so every
# data push rebuilds the site, which is the intended behavior.

[build]
  base = "web"
  command = "npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed assets are immutable; the HTML entry point must not be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
